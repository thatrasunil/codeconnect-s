<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Glow Effect -->
  <circle cx="250" cy="250" r="180" fill="url(#grad1)" opacity="0.2" filter="url(#glow)" />
  
  <!-- Outer Hexagon-ish Shape -->
  <path d="M250 50 L423 150 L423 350 L250 450 L77 350 L77 150 Z" 
        fill="none" 
        stroke="url(#grad1)" 
        stroke-width="15" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Inner Connection Nodes -->
  <circle cx="250" cy="150" r="25" fill="#f8fafc" />
  <circle cx="163" cy="300" r="25" fill="#f8fafc" />
  <circle cx="337" cy="300" r="25" fill="#f8fafc" />
  
  <!-- Traces connecting nodes -->
  <path d="M250 150 L163 300" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
  <path d="M250 150 L337 300" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
  <path d="M163 300 L337 300" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
  
  <!-- Central Core -->
  <circle cx="250" cy="250" r="15" fill="#06b6d4" />
</svg>